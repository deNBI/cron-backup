name: Publish Docker
on:
  workflow_dispatch:
    inputs:
      fail_on_findings:
        description: 'Abort publish on scan findings (Tier 1/2)'
        required: false
        default: 'true'
        type: boolean
  push:
    branches:
      - 'main'

# Publishes the branch image. The scan always runs (report in step summary,
# Matrix notify if enabled).
#
# fail_on_findings controls whether the publish is aborted on Tier 1/2
# findings:
#   - default true (strict): scan findings block the publish
#   - set false: scan runs, findings are reported, but the publish continues
#
# When triggered manually via workflow_dispatch, you can override the
# default (e.g. set fail_on_findings: false to publish despite findings).
#
# Do not use this for production releases - use create_release_image.yml
# for those (which keeps the strict behavior).
jobs:
  publish:
    uses: denbi/portal-github-actions/.github/workflows/publish-branch-image.yml@main
    with:
      image_name: oci.bi.denbi.de/denbicloud/cron-backup
      dockerfile: Dockerfile
      runs_on: '["ubuntu-latest"]'
      fail_on_findings: ${{ inputs.fail_on_findings }}
    secrets:
      OCI_USERNAME: ${{ secrets.OCI_DENBI_USERNAME }}
      OCI_TOKEN: ${{ secrets.OCI_DENBI_TOKEN }}
      CUSTOM_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  special_builds:
    needs: publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        type: [postgresql, mysql, mongodb]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Extract branch name
        shell: bash
        run: echo "tag=$(echo ${GITHUB_REF#refs/heads/} | sed 's|/|-|g')" >> $GITHUB_OUTPUT
        id: branch_tag

      - name: Build and Scan Special Image
        uses: denbi/portal-github-actions/build-and-scan-image@main
        with:
          image: oci.bi.denbi.de/denbicloud/cron-backup:${{ matrix.type }}-${{ steps.branch_tag.outputs.tag }}
          dockerfile: ${{ matrix.type }}/Dockerfile
          context: ${{ matrix.type }}
          username: ${{ secrets.OCI_DENBI_USERNAME }}
          password: ${{ secrets.OCI_DENBI_TOKEN }}
          notify_matrix: false
          fail_on_findings: ${{ inputs.fail_on_findings }}
          build_args: "BASE_TAG=${{ steps.branch_tag.outputs.tag }}"

      - name: Publish Special Image
        uses: denbi/portal-github-actions/publish-image@main
        with:
          image: oci.bi.denbi.de/denbicloud/cron-backup:${{ matrix.type }}-${{ steps.branch_tag.outputs.tag }}
          sbom_filename: ${{ github.event.repository.name }}-${{ matrix.type }}-sbom-${{ steps.branch_tag.outputs.tag }}.spdx.json

      - name: Cleanup Local Image
        if: always()
        uses: denbi/portal-github-actions/cleanup-image@main
        with:
          image: oci.bi.denbi.de/denbicloud/cron-backup:${{ matrix.type }}-${{ steps.branch_tag.outputs.tag }}
