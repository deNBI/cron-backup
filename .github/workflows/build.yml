name: build-image
on:
    pull_request:
    workflow_dispatch:

jobs:
    build-test:
        runs-on: ubuntu-latest
        steps:
            - name: Workflow run cleanup action
              uses: rokroskar/workflow-run-cleanup-action@ee1451b869ba1e381729b3d40489997021f0d562 # v0.3.3
              env:
                  GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Build and Scan Image
              uses: denbi/portal-github-actions/build-and-scan-image@main
              with:
                image: localbuild/base-cron:${{ github.sha }}
                dockerfile: Dockerfile
                username: ${{ secrets.OCI_USERNAME }}
                password: ${{ secrets.OCI_TOKEN }}
                notify_matrix: false

    special_builds:
        runs-on: ubuntu-latest
        needs: build-test
        strategy:
            fail-fast: false
            matrix:
                type: [postgresql, mysql, mongodb]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Build and Scan Special Image
              uses: denbi/portal-github-actions/build-and-scan-image@main
              with:
                image: localbuild/${{ matrix.type }}-cron:${{ github.sha }}
                dockerfile: ${{ matrix.type }}/Dockerfile
                username: ${{ secrets.OCI_USERNAME }}
                password: ${{ secrets.OCI_TOKEN }}
                notify_matrix: false
