name: Create Release Image
on:
  release:
    types: [ published,edited,created ]
  push:
    tags:
      - '*'
jobs:
  release:
    uses: denbi/portal-github-actions/.github/workflows/release-image.yml@90b66e053fd875b069e6da8e97ea3a2a54bcc2e4 # main
    with:
      image_name: oci.bi.denbi.de/denbicloud/cron-backup
      image_tag: ${{ github.ref_name }}
      dockerfile: Dockerfile
      notify_matrix: true
      RUNS_ON: '["ubuntu-latest"]'
    secrets:
      OCI_USERNAME: ${{ secrets.OCI_DENBI_USERNAME }}
      OCI_TOKEN: ${{ secrets.OCI_DENBI_TOKEN }}
      CUSTOM_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MATRIX_ACCESS_TOKEN: ${{ secrets.MATRIX_ACCESS_TOKEN }}
      MATRIX_ROOM: ${{ secrets.MATRIX_CRITICAL_ROOM }}

  tag_latest:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Login to OCI Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: oci.bi.denbi.de
          username: ${{ secrets.OCI_DENBI_USERNAME }}
          password: ${{ secrets.OCI_DENBI_TOKEN }}
      - name: Tag and Push Latest
        shell: bash
        run: |
          TAG="${{ needs.release.outputs.IMAGE_TAG }}"
          echo "Tagging cron-backup:${TAG} as latest"
          docker pull oci.bi.denbi.de/denbicloud/cron-backup:${TAG}
          docker tag  oci.bi.denbi.de/denbicloud/cron-backup:${TAG} oci.bi.denbi.de/denbicloud/cron-backup:latest
          docker push oci.bi.denbi.de/denbicloud/cron-backup:latest

  special_builds:
    needs: [ release, tag_latest ]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        type: [ postgresql, mysql, mongodb ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build, Scan and Publish Special Image
        uses: denbi/portal-github-actions/build-and-scan-image@90b66e053fd875b069e6da8e97ea3a2a54bcc2e4 # main
        with:
          image: oci.bi.denbi.de/denbicloud/cron-backup:${{ matrix.type }}-${{ github.ref_name }}
          dockerfile: ${{ matrix.type }}/Dockerfile
          context: ${{ matrix.type }}
          username: ${{ secrets.OCI_DENBI_USERNAME }}
          password: ${{ secrets.OCI_DENBI_TOKEN }}
          notify_matrix: true
          build_args: "BASE_TAG=${{ github.ref_name }}"

      - name: Publish Special Image
        uses: denbi/portal-github-actions/publish-image@90b66e053fd875b069e6da8e97ea3a2a54bcc2e4 # main
        with:
          image: oci.bi.denbi.de/denbicloud/cron-backup:${{ matrix.type }}-${{ github.ref_name }}
          sbom_filename: ${{ github.event.repository.name }}-${{ matrix.type }}-sbom-${{ github.ref_name }}.spdx.json

      - name: Cleanup Local Image
        if: always()
        uses: denbi/portal-github-actions/cleanup-image@90b66e053fd875b069e6da8e97ea3a2a54bcc2e4 # main
        with:
          image: oci.bi.denbi.de/denbicloud/cron-backup:${{ matrix.type }}-${{ github.ref_name }}
