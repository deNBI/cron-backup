name: Create Release Image
on:
  release:
    types: [ published,edited,created ]
  push:
    tags:
      - '*'
jobs:
  release:
    uses: denbi/portal-github-actions/.github/workflows/release-image.yml@02ae1f46b32e057557da1e90ec0e4c28b7c3754d # main
    with:
      image_name: oci.bi.denbi.de/denbicloud/cron-backup
      image_tag: ${{ github.ref_name }}
      dockerfile: Dockerfile
      notify_matrix: true
      RUNS_ON: '["ubuntu-latest"]'
    secrets:
      OCI_USERNAME: ${{ secrets.OCI_DENBI_USERNAME }}
      OCI_TOKEN: ${{ secrets.OCI_DENBI_TOKEN }}
      CUSTOM_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MATRIX_ACCESS_TOKEN: ${{ secrets.MATRIX_ACCESS_TOKEN }}
      MATRIX_ROOM: ${{ secrets.MATRIX_CRITICAL_ROOM }}

  special_builds:
    needs: release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        type: [ postgresql, mysql, mongodb ]
    steps:
      - name: Build, Scan and Publish Special Image
        uses: denbi/portal-github-actions/build-and-scan-image@02ae1f46b32e057557da1e90ec0e4c28b7c3754d # main
        with:
          image: oci.bi.denbi.de/denbicloud/cron-backup:${{ matrix.type }}-${{ github.ref_name }}
          dockerfile: ${{ matrix.type }}/Dockerfile
          context: ${{ matrix.type }}
          username: ${{ secrets.OCI_DENBI_USERNAME }}
          password: ${{ secrets.OCI_DENBI_TOKEN }}
          notify_matrix: true
          build_args: "BASE_TAG=${{ github.ref_name }}"

      - name: Publish Special Image
        uses: denbi/portal-github-actions/publish-image@02ae1f46b32e057557da1e90ec0e4c28b7c3754d # main
        with:
          image: oci.bi.denbi.de/denbicloud/cron-backup:${{ matrix.type }}-${{ github.ref_name }}
          sbom_filename: ${{ github.event.repository.name }}-${{ matrix.type }}-sbom-${{ github.ref_name }}.spdx.json

      - name: Cleanup Local Image
        if: always()
        uses: denbi/portal-github-actions/cleanup-image@02ae1f46b32e057557da1e90ec0e4c28b7c3754d # main
        with:
          image: oci.bi.denbi.de/denbicloud/cron-backup:${{ matrix.type }}-${{ github.ref_name }}
