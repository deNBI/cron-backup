name: Publish Docker
on: 
  workflow_dispatch:
  push:
    branches: 
      - 'main'
jobs:
  publish:
    uses: denbi/portal-github-actions/.github/workflows/publish-branch-image.yml@main
    with:
      image_name: oci.bi.denbi.de/denbicloud/cron-backup
      dockerfile: Dockerfile
      RUNS_ON: '["ubuntu-latest"]'
    secrets:
      OCI_USERNAME: ${{ secrets.OCI_USERNAME }}
      OCI_TOKEN: ${{ secrets.OCI_TOKEN }}
      CUSTOM_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  special_builds:
    needs: publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        type: [postgresql, mysql, mongodb]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Extract branch name
        shell: bash
        run: echo "tag=$(echo ${GITHUB_REF#refs/heads/} | sed 's|/|-|g')" >> $GITHUB_OUTPUT
        id: branch_tag

      - name: Build and Scan Special Image
        uses: denbi/portal-github-actions/build-and-scan-image@main
        with:
          image: oci.bi.denbi.de/denbicloud/cron-backup:${{ matrix.type }}-${{ steps.branch_tag.outputs.tag }}
          dockerfile: ${{ matrix.type }}/Dockerfile
          username: ${{ secrets.OCI_USERNAME }}
          password: ${{ secrets.OCI_TOKEN }}
          notify_matrix: false
          build_args: "BASE_TAG=${{ steps.branch_tag.outputs.tag }}"

      - name: Publish Special Image
        uses: denbi/portal-github-actions/publish-image@main
        with:
          image: oci.bi.denbi.de/denbicloud/cron-backup:${{ matrix.type }}-${{ steps.branch_tag.outputs.tag }}
          sbom_filename: ${{ github.event.repository.name }}-${{ matrix.type }}-sbom-${{ steps.branch_tag.outputs.tag }}.spdx.json

      - name: Cleanup Local Image
        if: always()
        uses: denbi/portal-github-actions/cleanup-image@main
        with:
          image: oci.bi.denbi.de/denbicloud/cron-backup:${{ matrix.type }}-${{ steps.branch_tag.outputs.tag }}

  special_builds:
      runs-on: ubuntu-latest
      needs: build
      strategy:
        fail-fast: false
        matrix:
          type: [ postgresql, mysql, mongodb ]
      steps:

        - name: Workflow run cleanup action
          uses: rokroskar/workflow-run-cleanup-action@ee1451b869ba1e381729b3d40489997021f0d562 # v0.3.3
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        - uses: actions/checkout@61b9e3751b92087fd0b06925ba6dd6314e06f089 # master
        - name: Extract branch name
          shell: bash
          run: echo "##[set-output name=branch;]$(echo ${GITHUB_REF#refs/heads/})"
          id: extract_branch

        - name: Set tag
          run: sed 's/\//-/g'  <<< "::set-output name=TAG::${{ steps.extract_branch.outputs.branch }}"
          id: tag
        - name: Get tag
          run: echo "The selected tag is ${{ steps.tag.outputs.TAG }}"

        -
          name: Set up Docker Buildx
          uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        - name: Login to de.NBI OCI
          uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
          with:
            registry: oci.bi.denbi.de
            username: ${{ secrets.OCI_DENBI_USERNAME }}
            password: ${{ secrets.OCI_DENBI_TOKEN }}
        - name: Build and publish image to de.NBI OCI
          uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
          env:
            BASE_TAG: ${{ steps.tag.outputs.TAG }}
          with:
            file: ${{matrix.type}}/Dockerfile
            context: ${{matrix.type}}
            push: true
            build-args: BASE_TAG
            tags: oci.bi.denbi.de/denbicloud/cron-backup:${{matrix.type}}-${{ steps.tag.outputs.TAG }}
