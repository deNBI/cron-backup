ignore:
  # CVE-2025-60876 affects BusyBox wget URL handling.
  # The cron-backup application does not use BusyBox wget with untrusted URLs.
  # Revisit when Alpine publishes a patched BusyBox package.
  - vulnerability: CVE-2025-60876
    package:
      name: busybox
      type: apk
    reason: >
      Tier 4 - risk accepted, ref guidelines/security/accepted-risks.md.
      Not reachable: BusyBox wget is not used with untrusted URLs in this
      container (curl is used for HTTP, BusyBox wget is not invoked by the
      backup scripts).
      Next review date: 2027-01-31

  - vulnerability: CVE-2025-60876
    package:
      name: busybox-binsh
      type: apk
    reason: >
      Tier 4 - risk accepted, ref guidelines/security/accepted-risks.md.
      Not reachable: BusyBox wget is not used with untrusted URLs in this
      container (curl is used for HTTP, BusyBox wget is not invoked by the
      backup scripts).
      Next review date: 2027-01-31

  - vulnerability: CVE-2025-60876
    package:
      name: ssl_client
      type: apk
    reason: >
      Tier 4 - risk accepted, ref guidelines/security/accepted-risks.md.
      Not reachable: BusyBox wget is not used with untrusted URLs in this
      container (curl is used for HTTP, BusyBox wget is not invoked by the
      backup scripts).
      Next review date: 2027-01-31

  - vulnerability: CVE-2025-60876
    package:
      name: busybox-extras
      type: apk
    reason: >
      Tier 4 - risk accepted, ref guidelines/security/accepted-risks.md.
      Not reachable: BusyBox wget is not used with untrusted URLs in this
