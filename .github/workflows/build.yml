name: build-image
on:
    pull_request:
    workflow_dispatch:

jobs:
    build-test:
        runs-on: ubuntu-latest
        steps:
            - name: Workflow run cleanup action
              uses: rokroskar/workflow-run-cleanup-action@ee1451b869ba1e381729b3d40489997021f0d562 # v0.3.3
              env:
                  GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Build and Scan Image
              uses: denbi/portal-github-actions/build-and-scan-image@02ae1f46b32e057557da1e90ec0e4c28b7c3754d # main
              with:
                image: localbuild/base-cron:${{ github.sha }}
                dockerfile: Dockerfile
                username: ${{ secrets.OCI_DENBI_USERNAME }}
                password: ${{ secrets.OCI_DENBI_TOKEN }}
                notify_matrix: false
